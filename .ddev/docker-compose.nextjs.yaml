# DDEV side-car for the Next.js frontend.
# Lives alongside the Drupal web container so the two share the project network
# and can address each other by service name (web, nextjs).
services:
  nextjs:
    container_name: ddev-${DDEV_SITENAME}-nextjs
    image: node:20-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile || pnpm install ; pnpm dev"
    restart: "no"
    expose:
      - "3000"
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app:cached
      - nextjs_node_modules:/app/node_modules
    environment:
      - DRUPAL_BASE_URL=http://web/
      - NEXT_PUBLIC_DRUPAL_BASE_URL=https://${DDEV_SITENAME}.ddev.site
      - NEXT_PUBLIC_FRONTEND_URL=http://localhost:3000
      - DRUPAL_PREVIEW_SECRET=${DRUPAL_PREVIEW_SECRET:-dev-preview-secret-change-me}
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: $DDEV_APPROOT
    networks:
      - default
      - ddev_default
    depends_on:
      - web

networks:
  ddev_default:
    name: ddev_default
    external: true

volumes:
  nextjs_node_modules:
