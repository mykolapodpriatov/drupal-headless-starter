name: CI - Frontend (Next.js)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'

permissions:
  contents: read

# Split into named jobs on purpose: a single linear job reports one red X and
# tells you nothing, while these show at a glance whether a PR broke style,
# behaviour, the build or the integration.
env:
  # Build-time fallbacks so `next build` does not bail when env is unset.
  DRUPAL_BASE_URL: http://localhost
  NEXT_PUBLIC_DRUPAL_BASE_URL: http://localhost
  NEXT_PUBLIC_FRONTEND_URL: http://localhost:3000
  DRUPAL_CLIENT_ID: ci
  DRUPAL_CLIENT_SECRET: ci
  DRUPAL_PREVIEW_SECRET: ci
  DRUPAL_REVALIDATE_SECRET: ci

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Formatting (Prettier)
        run: pnpm format:check
      - name: Types (tsc --noEmit)
        run: pnpm typecheck
      - name: Lint (ESLint)
        run: pnpm lint

  tests:
    name: Tests
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Unit + component tests (Vitest, incl. axe)
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Production build (Next.js)
        run: pnpm build
      - name: Storybook build
        run: pnpm build-storybook --quiet

  e2e:
    name: E2E
    runs-on: ubuntu-22.04
    needs: build
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Chromium only: the suite asserts behaviour, not rendering, so the other
      # engines would triple the runtime for no additional signal.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      # Playwright's webServer starts the mock Drupal backend and a production
      # `next build && next start` against it — env lives in playwright.config.ts.
      - name: Playwright
        run: pnpm e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
          if-no-files-found: ignore
