name: 'Headless Starter'
description: 'Configures a Drupal 11 site as a decoupled backend for Next.js: JSON:API + jsonapi_extras, simple_oauth, graphql_compose, decoupled_router, an Article content type, and an editor role wired to draft + preview.'
type: 'Site'

install:
  # Core
  - node
  - path
  - text
  - image
  - media
  - media_library
  - field_ui
  - views_ui
  # Decoupled stack
  - jsonapi
  - jsonapi_extras
  - graphql
  - graphql_compose
  - graphql_compose_blocks
  - graphql_compose_routes
  - decoupled_router
  - subrequests
  - rest
  - restui
  - serialization
  # OAuth2 server
  - simple_oauth
  - consumers

# This recipe ships its own configuration under recipes/headless_starter/config/.
# Every YAML file in that directory is created automatically once the modules in
# `install:` are enabled — the Article content type and its fields, the editor
# and frontend_consumer roles, and the simple_oauth / jsonapi_extras settings.
#
# `config.import` is intentionally not used: that key imports configuration that
# *other* installed modules ship, whereas everything here is authored by us. We
# also deliberately do not manage core.extension (handled by `install:`) or
# system.site (the site name is set by `drush site:install`).

# Recipes that this recipe builds on. Drupal's own "core/recipes/article_content_type"
# would normally do the heavy lifting, but we want full control over the field
# storage + JSON:API resource shape, so we ship our own copies under config/.
recipes: []
